map $http_user_agent $is_social_bot {
  default 0;
  "~*facebookexternalhit" 1;
  "~*Facebot" 1;
  "~*Twitterbot" 1;
  "~*WhatsApp" 1;
  "~*TelegramBot" 1;
  "~*LinkedInBot" 1;
  "~*Slackbot" 1;
  "~*Discordbot" 1;
  "~*Pinterest" 1;
  "~*Googlebot" 1;
  "~*bingbot" 1;
  "~*Applebot" 1;
  "~*Signal" 1;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name auxiliumasociacion.online www.auxiliumasociacion.online auxiliumasociacion.com www.auxiliumasociacion.com auxilium.local localhost;

  root /usr/share/nginx/html;
  index index.html;

  location ^~ /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location ^~ /admin/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location ^~ /static/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location ^~ /media/ {
    proxy_pass http://backend:8000/media/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Archivos estáticos del frontend (Vite)
  location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot|webp)$ {
    try_files $uri =404;
  }

  # Intercepta bots de redes sociales para noticias individuales y les entrega HTML estático
  location ~ ^/news/(?!page(?:/|$))([a-zA-Z0-9_-]+)/?$ {
    set $slug $1;
    if ($is_social_bot) {
      rewrite ^ /internal-bot-news/$slug last;
    }
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/internal-bot-news/(.*)$ {
    internal;
    proxy_pass http://backend:8000/api/bot/news/$1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Redirección interna para bots en cualquier otra sección de la web (/projects, /about-us, /donations, /)
  location / {
    if ($is_social_bot) {
      rewrite ^ /internal-bot-page$uri last;
    }
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/internal-bot-page(.*)$ {
    internal;
    proxy_pass http://backend:8000/api/bot/page$1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
}